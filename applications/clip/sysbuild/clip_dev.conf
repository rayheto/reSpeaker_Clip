# Development environment Kconfig fragment (FILE_SUFFIX=dev).
#
# Auto-enable the app's USB CDC ACM + MSC at boot (no BLE AT+USB=on needed),
# with DYNAMIC MSC handoff: the CDC console stays enumerated at all times,
# and while a recording or file transfer runs, the MSC media is reported
# ejected so the app owns the SD card; when the activity stops the media
# comes back. Logs keep flowing over CDC for the whole recording. The
# console is redirected to the CDC port by
# boards/clip_nrf5340_cpuapp_dev.overlay.
# Sysbuild picks this up for the clip image only when built with
# -DFILE_SUFFIX=dev; mcuboot/b0n/ipc_radio keep their own configuration.
CONFIG_CLIP_USB_AUTO_ENABLE=y
CONFIG_CLIP_USB_MSC_DYNAMIC=y

# Dev builds log over the CDC console; the FS (SD) log backend is disabled
# to keep the app image within the fixed 911.5 KB app partition (saves
# ~1.3 KB of text). AT+LOG=info/debug reports "FS log backend unavailable".
CONFIG_LOG_BACKEND_FS=n

# Stack high-water diagnostics for the RTC stall investigation
CONFIG_INIT_STACKS=y
CONFIG_CLIP_RTC_THREAD_PRIORITY=3
